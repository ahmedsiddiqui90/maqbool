# Keeps the free Render API awake (it sleeps after ~15 min without traffic and takes ~1 min to wake).
# GitHub's scheduler can run late, so also add an external pinger (UptimeRobot / cron-job.org)
# on the same URL every 5 minutes. Scheduled workflows only run from the default branch.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health (retries cover a cold start)
        run: |
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            -w "\nstatus=%{http_code} time=%{time_total}s\n" \
            https://maqbool-api.onrender.com/health
