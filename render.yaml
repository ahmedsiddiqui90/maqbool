# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the dashboard.
services:
  - type: web
    name: maqbool
    runtime: docker
    region: ohio   # same region as the Neon database: ~45% faster turns than Oregon
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: MODEL
        value: claude-haiku-5-5
      - key: CORS_ORIGINS
        value: "*"
      # Free plan has 512 MB RAM. Set to 1 if the service is killed for memory (BM25-only retrieval).
      - key: DISABLE_EMBEDDINGS
        value: "0"

  # Customer page + staff dashboard (Vite/React). Static sites are free and never sleep.
  # VITE_API_URL is baked in at build time; change it and redeploy if the API URL changes.
  - type: web
    name: maqbool-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://maqbool.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
